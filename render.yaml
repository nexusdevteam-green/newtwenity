services:
  - type: web
    name: tuenties-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://tuenties.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://tuenties.onrender.com,http://localhost:5173
